name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Never paste your API key.** For security issues, use private vulnerability reporting instead (see SECURITY.md).
  - type: input
    id: tool
    attributes:
      label: Tool
      placeholder: generate_image
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model id
      placeholder: google/gemini-2.5-flash-image
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you asked Claude, the tool arguments (without secrets) and the exact error or output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Output of `node --version` and `claude --version`, and your OS.
    validations:
      required: true
